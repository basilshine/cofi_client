# T4/T5 — Quality gate for @cofi/web + shared API package (see cofi_brain/tasks/frontend-multiapp-foundation.md)
name: Web CI

on:
  push:
    branches: [main, master]
    paths:
      - "apps/web/**"
      - "apps/telegram-webapp/**"
      - "apps/marketing/**"
      - "packages/api/**"
      - "packages/ui/**"
      - "tests/styles/**"
      - "playwright.styles.config.ts"
      - "tailwind.config.cjs"
      - "scripts/check-boundaries.mjs"
      - "package.json"
      - "package-lock.json"
      - "biome.json"
      - ".github/workflows/web-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "apps/web/**"
      - "apps/telegram-webapp/**"
      - "apps/marketing/**"
      - "packages/api/**"
      - "packages/ui/**"
      - "tests/styles/**"
      - "playwright.styles.config.ts"
      - "tailwind.config.cjs"
      - "scripts/check-boundaries.mjs"
      - "package.json"
      - "package-lock.json"
      - "biome.json"
      - ".github/workflows/web-ci.yml"

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint (web + packages/api)
        run: npm run lint:web

      - name: Architecture boundaries (strict)
        run: npm run lint:boundaries

      - name: Production builds (tsc + vite)
        run: npm run build:all
        env:
          # Vite may read env at build time; CI does not need a real API
          VITE_API_URL: "http://127.0.0.1:8000"

      - name: Install test browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Legacy stylesheet regression checks
        run: npm run test:styles -- --workers=2
