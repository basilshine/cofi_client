name: PNZ Client AdminVPS Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adminvps-landing
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint:boundaries
      - run: npm run test:money --workspace apps/poka-ne-zabyl
      - run: npm run build:pnz
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.pnz.config.ts --workers=1
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && vars.ADMINVPS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build immutable application image
        run: |
          docker build -f apps/poka-ne-zabyl/Dockerfile -t pnz-landing:$GITHUB_SHA .
          docker save pnz-landing:$GITHUB_SHA | gzip -1 > "$RUNNER_TEMP/image.tar.gz"
      - name: Deploy only landing
        env:
          DEPLOY_HOST: ${{ secrets.ADMINVPS_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.ADMINVPS_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.ADMINVPS_DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_KNOWN_HOSTS" && test -n "$DEPLOY_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/id_ed25519 "$RUNNER_TEMP/image.tar.gz"' EXIT
          ssh-keygen -y -P '' -f ~/.ssh/id_ed25519 > /dev/null
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 "root@$DEPLOY_HOST" status
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 "root@$DEPLOY_HOST" "deploy landing $GITHUB_SHA" < "$RUNNER_TEMP/image.tar.gz"
