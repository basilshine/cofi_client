map $host $pnz_root_document {
	default /index.html;
	business.poka-ne-zabyl.ru /app.html;
}

map $sent_http_content_type $pnz_cache_control {
	default "";
	~*text/html "no-store, no-cache, must-revalidate";
}

server {
	listen 80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;
	absolute_redirect off;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
	add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
	add_header Cache-Control $pnz_cache_control always;

	error_page 404 /404.html;

	location = / {
		try_files $pnz_root_document =404;
	}

	location ~ ^/(en|es)$ {
		return 301 /$1/;
	}

	location ~ ^/(en|es)/$ {
		try_files /$1/index.html =404;
	}

	location = /favicon.svg {
		try_files /assets/poka-ne-zabyl-logo.svg =404;
	}

	location = /manifest.webmanifest {
		default_type application/manifest+json;
		try_files /manifest.webmanifest =404;
	}

	location = /business-manifest.webmanifest {
		default_type application/manifest+json;
		try_files /business-manifest.webmanifest =404;
	}

	location = /sw.js {
		expires -1;
		try_files /sw.js =404;
	}

	location ~ ^/(offer|privacy|consent|refunds)/$ {
		return 301 /$1;
	}

	location ~ ^/(offer|privacy|consent|refunds)$ {
		try_files $uri.html =404;
	}

	location ~ ^/(family|repair|crew|events|business|telegram-expense-bot)/$ {
		return 301 /$1;
	}

	location ~ ^/(family|repair|crew|events|business|telegram-expense-bot)$ {
		try_files $uri.html =404;
	}

	location ~ ^/(en|es)/(privacy|consent)/$ {
		return 301 /$1/$2;
	}

	location ~ ^/(en|es)/(privacy|consent)$ {
		try_files $uri.html =404;
	}

	location = /app {
		try_files /app.html =404;
	}

	location = /join {
		try_files /app.html =404;
	}

	location = /payment/success {
		try_files /payment-success.html =404;
	}

	location = /payment/failed {
		try_files /payment-failed.html =404;
	}

	location = /404.html {
		internal;
	}

	location / {
		try_files $uri =404;
	}
}
